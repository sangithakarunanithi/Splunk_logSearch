<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Comparer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.container {
  max-width: 640px;
  width: 100%;
  text-align: center;
}
.logo { margin-bottom: 12px; }
.logo svg { width: 40px; height: 40px; }
h1 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #f0f6fc;
}
.subtitle {
  color: #8b949e;
  font-size: 14px;
  margin-bottom: 36px;
}
.card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 36px 28px;
  text-align: left;
}
.form-group { margin-bottom: 24px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #8b949e;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.file-input {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #0d1117;
  border: 1px dashed #30363d;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.file-input:hover { border-color: #58a6ff; }
.file-input input {
  display: none;
}
.file-input .label {
  color: #8b949e;
  font-size: 14px;
}
.file-input .label.has-file { color: #58a6ff; }
button {
  width: 100%;
  padding: 14px;
  background: #238636;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 8px;
}
button:hover { background: #2ea043; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.error {
  background: #3d1214;
  border: 1px solid #da3633;
  color: #ff7b72;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
}
.spinner {
  display: none;
  margin: 16px auto;
  width: 32px;
  height: 32px;
  border: 3px solid #30363d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
body.loading .spinner { display: block; }
body.loading button { display: none; }
body.loading .card { opacity: 0.7; }
.file-info {
  font-size: 12px;
  color: #8b949e;
  margin-top: 4px;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
  </div>
  <h1>Log Comparer</h1>
  <p class="subtitle">Upload two Splunk CSV logs to find behavioral differences</p>

  <div th:if="${error}" class="error" th:text="${error}"></div>

  <div class="card">
    <form method="post" action="/compare" enctype="multipart/form-data"
          onsubmit="document.body.classList.add('loading')">
      <div class="form-group">
        <label for="fileA">Correct / Expected Log</label>
        <div class="file-input" onclick="document.getElementById('fileA').click()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="label" id="labelA">Choose CSV file...</span>
          <input type="file" id="fileA" name="fileA" accept=".csv"
                 onchange="document.getElementById('labelA').textContent=this.files[0].name+(' ('+this.files[0].size+' bytes)');document.getElementById('labelA').classList.add('has-file')" />
        </div>
      </div>
      <div class="form-group">
        <label for="fileB">Suspect / Misbehaving Log</label>
        <div class="file-input" onclick="document.getElementById('fileB').click()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="label" id="labelB">Choose CSV file...</span>
          <input type="file" id="fileB" name="fileB" accept=".csv"
                 onchange="document.getElementById('labelB').textContent=this.files[0].name+(' ('+this.files[0].size+' bytes)');document.getElementById('labelB').classList.add('has-file')" />
        </div>
      </div>
      <button type="submit">Compare Logs</button>
      <div class="spinner"></div>
    </form>
  </div>
</div>
</body>
</html>
